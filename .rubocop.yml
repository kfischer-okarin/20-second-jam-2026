inherit_mode:
  merge:
    - Exclude

AllCops:
  NewCops: enable
  # DragonRuby's mruby reports RUBY_VERSION 3.0 (mruby 3.0.0)
  TargetRubyVersion: 3.0
  # Ruby files of the engine copied into the repository
  Exclude:
    - builds/**/*
    - docs/**/*
    - mygame-template/**/*
    - samples/**/*

# --- Personal preferences ---
Layout/LineLength:
  Max: 120

Style/BlockDelimiters:
  EnforcedStyle: semantic

# --- DragonRuby basic settings ---

# See this as refactoring suggestion not problem
Metrics/AbcSize:
  Severity: info

# describe blocks hold all examples of a test file
Metrics/BlockLength:
  Exclude:
    - mygame/tests/**/*

# See this as refactoring suggestion not problem
Metrics/ClassLength:
  Severity: info

# See this as refactoring suggestion not problem
Metrics/MethodLength:
  Severity: info
  Exclude:
    - mygame/tests/**/*

# See this as refactoring suggestion not problem
Metrics/ModuleLength:
  Severity: info

# 3D math needs coordinates plus sizes (Sdf.round_box(x, y, z, half_x, half_y, half_z, rounding)), and keyword
# arguments are named at every call site
Metrics/ParameterLists:
  Max: 7
  CountKeywordArgs: false

# Typical parameters/attributes for DragonRuby primitives
Naming/MethodParameterName:
  AllowedNames:
    - x
    - y
    - w
    - h
    - r
    - g
    - b
    - a
    # Vector components and time steps in 3D and simulation math
    - z
    - t
    - dt
    - dx
    - dy
    - dz
    - nx
    - ny
    - nz
    - rx
    - ry
    - rz
    - tx
    - ty
    - tz
    - vx
    - vy
    - up
    # Corners of DragonRuby's triangle primitives
    - x1
    - y1
    - x2
    - y2
    - x3
    - y3
    - x4
    - y4

Style/Documentation:
  Enabled: false

# Meaningless in mruby
Style/FrozenStringLiteralComment:
  Enabled: false

Style/GlobalVars:
  AllowedVariables:
    - $gtk

# Hash#to_h ignores its block in mruby and returns the unchanged hash
Style/MapToHash:
  Enabled: false

# module_function without arguments does nothing in mruby
Style/ModuleFunction:
  EnforcedStyle: extend_self

# Not implemented in mruby
Style/RandomWithOffset:
  Enabled: false

# --- Web runtime ---

# web/runtime/dragonruby.rb is DragonRuby's API reimplemented in the one file main.c loads, under DragonRuby's
# method names (keyboard.left answers true or nil, require true or false)
Naming/PredicateMethod:
  Exclude:
    - web/runtime/dragonruby.rb

Style/OneClassPerFile:
  Exclude:
    - web/runtime/dragonruby.rb
